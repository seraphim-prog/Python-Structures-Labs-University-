{% load static %}
<!doctype html>
<html lang="uk">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Практикум{% endblock %}</title>
    <link rel="stylesheet" href="{% static 'site.css' %}">
</head>
<body>
    <header class="site-header">
        <div class="shell header-inner">
            <a class="brand" href="{% url 'home' %}">
                <span class="brand-mark" aria-hidden="true">П</span>Практикум
            </a>
            <nav aria-label="Основна навігація">
                <a href="{% url 'home' %}"{% if page == "home" %} aria-current="page"{% endif %}>Огляд</a>
                <a href="{% url 'program' %}"{% if page == "program" %} aria-current="page"{% endif %}>Програма</a>
                <a class="nav-action" href="{% url 'apply' %}"{% if page == "apply" %} aria-current="page"{% endif %}>Подати заявку</a>
            </nav>
        </div>
    </header>
    <main class="shell site-main">{% block content %}{% endblock %}</main>
    <footer class="site-footer">
        <div class="shell footer-inner">
            <span>© {{ year }} Практикум</span>
            <span>Навчальний проєкт · Django</span>
        </div>
    </footer>
</body>
</html>
